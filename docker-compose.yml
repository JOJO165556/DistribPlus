services:

  postgres:
    image: postgres:16-alpine
    container_name: distribplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-distribplus}
      POSTGRES_USER: ${POSTGRES_USER:-distribplus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-distribplus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:v0.52.4
    container_name: distribplus-metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data

  # pipeline:  # décommenté à l'itération 1
  #   build: .
  #   container_name: distribplus-pipeline
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file: .env
  #   volumes:
  #     - ./data:/app/data

volumes:
  postgres-data:
  metabase-data:
