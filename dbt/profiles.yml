distribplus:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: 5432
      user: "{{ env_var('POSTGRES_USER', 'distribplus') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'changeme') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'distribplus') }}"
      schema: dwh
      threads: 4
